[package]
name = "cig"
version = "0.1.0"
description = "Intelligence sugli appalti pubblici italiani"
edition = "2021"
rust-version = "1.85"

[lib]
name = "cig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname"] }
rust_xlsxwriter = "0.101"
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub"] }
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
pdf-extract = "0.7"
regex = "1"
tauri-plugin-dialog = "2"

[profile.dev]
opt-level = 1
# Senza debug info gli artefatti restano molto più piccoli: su questo disco
# la build completa altrimenti non ci sta.
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false
